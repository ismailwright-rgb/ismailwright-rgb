[build]
  # Deliberately empty. Nothing is served statically: every request must reach
  # the api function so basic auth covers the page as well as the API, and the
  # function serves public/ from its own bundle.
  #
  # The obvious alternative - publishing public/ and forcing /* to the function -
  # is a trap. A forced /* also matches /.netlify/functions/*, so the api
  # function intercepts calls meant for the background and scheduled functions
  # and they silently never run.
  publish = "netlify/site"
  command = "npm install --omit=dev"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # esbuild only bundles what is imported, so the page's files are named here.
  included_files = ["public/**"]

# No force: with an empty publish directory nothing static matches, so this
# takes every request except Netlify's own /.netlify/* paths, which stay
# reachable for the background and scheduled functions.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
